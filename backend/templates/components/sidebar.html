<div class="sidebar-backdrop d-md-none" id="sidebarBackdrop"></div>

<aside class="app-sidebar" id="appSidebar" aria-label="Primary navigation">
    <div class="d-md-none sidebar-mobile-header">
        <span class="fw-semibold">Navigation</span>
        <button class="btn btn-sm btn-light border" type="button" id="mobileSidebarClose" aria-label="Close navigation">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    {% if not is_shared_access %}
        <div class="dropdown">
            <button
                class="btn btn-primary new-button w-100 dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
            >
                <i class="bi bi-plus-lg me-2"></i>
                <span class="sidebar-text">New</span>
            </button>

            <ul class="dropdown-menu shadow-sm w-100">
                <li>
                    <button
                        type="button"
                        class="dropdown-item"
                        data-bs-toggle="modal"
                        data-bs-target="#createFolderModal"
                    >
                        <i class="bi bi-folder-plus me-2"></i>New folder
                    </button>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                    <button
                        type="button"
                        class="dropdown-item"
                        data-bs-toggle="modal"
                        data-bs-target="#uploadFolderModal"
                    >
                        <i class="bi bi-cloud-arrow-up me-2"></i>Upload folder
                    </button>
                </li>
                <li>
                    <button
                        type="button"
                        class="dropdown-item"
                        data-bs-toggle="modal"
                        data-bs-target="#uploadFileModal"
                    >
                        <i class="bi bi-file-earmark-arrow-up me-2"></i>Upload file
                    </button>
                </li>
            </ul>
        </div>
    {% endif %}

    <nav class="d-flex flex-column gap-1">
        <a
            href="{% url 'dashboard' %}"
            class="sidebar-link {% if not is_shared_access and request.resolver_match.url_name == 'dashboard' or not is_shared_access and request.resolver_match.url_name == 'folder_open' %}active{% endif %}"
            title="My Drive"
        >
            <i class="bi bi-house"></i>
            <span class="sidebar-text">My Drive</span>
        </a>

        <a
            href="{% url 'shared_with_me' %}"
            class="sidebar-link {% if request.resolver_match.url_name == 'shared_with_me' or is_shared_access %}active{% endif %}"
            title="Shared with me"
        >
            <i class="bi bi-people"></i>
            <span class="sidebar-text">Shared with me</span>
        </a>

        <a
            href="{% url 'trash' %}"
            class="sidebar-link {% if request.resolver_match.url_name == 'trash' or request.resolver_match.url_name == 'trash_folder_open' %}active{% endif %}"
            title="Trash"
        >
            <i class="bi bi-trash"></i>
            <span class="sidebar-text">Trash</span>
        </a>
    </nav>
</aside>
