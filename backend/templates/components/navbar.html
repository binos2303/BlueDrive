<!-- =========================
     NAVBAR
========================= -->
<nav class="app-navbar">
  <div class="container-fluid h-100 px-3 px-md-4">
    <div class="d-flex align-items-center h-100 gap-2 gap-md-3">
      <button
        class="btn btn-light border d-md-none mobile-menu-btn"
        type="button"
        id="mobileSidebarToggle"
        aria-label="Open navigation"
        aria-controls="appSidebar"
        aria-expanded="false"
      >
        <i class="bi bi-list fs-5"></i>
      </button>

      <div class="brand">
        <a href="{% url 'dashboard' %}" class="text-decoration-none text-dark">
          <i class="bi bi-cloud-fill text-primary me-1"></i>
          <span class="brand-label">SecureDrive</span>
        </a>
      </div>

      <div class="search-box flex-grow-1">
        <form method="GET" action="{% url 'search' %}">
          <div class="input-group">
            <span class="input-group-text border-0 bg-light">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="search"
              name="q"
              value="{{ request.GET.q|default:'' }}"
              class="form-control"
              placeholder="Search files and folders..."
              maxlength="100"
              autocomplete="off"
            />
          </div>
        </form>
      </div>

      <div class="d-flex align-items-center ms-auto">
        <div class="dropdown">
          <button
            class="btn p-0 border-0"
            type="button"
            data-bs-toggle="dropdown"
            aria-label="Account menu"
          >
            <div class="user-avatar">
              {{ request.user.username|first|upper }}
            </div>
          </button>

          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li>
              <h6 class="dropdown-header">{{ request.user.username }}</h6>
            </li>
            <li>
              <a class="dropdown-item" href="{% url 'profile' %}">
                <i class="bi bi-person me-2"></i>Profile
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
