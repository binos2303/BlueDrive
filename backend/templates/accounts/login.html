{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SecureDrive</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background: #f8f9fa;
        }

        .login-container {
            min-height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: 1px solid #dee2e6;
            border-radius: 16px;
        }

        .brand {
            font-size: 28px;
            font-weight: 600;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 24px;
        }

        .form-control {
            min-height: 48px;
            border-radius: 10px;
        }

        .login-btn {
            min-height: 48px;
            border-radius: 10px;
            font-weight: 500;
        }

        .security-text {
            font-size: 13px;
            color: #6c757d;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="row justify-content-center align-items-center login-container">

        <div class="col-12 d-flex justify-content-center">

            <div class="card shadow-sm login-card">

                <div class="card-body p-4 p-md-5">

                    <!-- Logo -->

                    <div class="text-center mb-4">

                        <div class="brand-icon">
                            ☁
                        </div>

                        <div class="brand">
                            SecureDrive
                        </div>

                        <p class="text-muted mt-2 mb-0">
                            Secure cloud file storage
                        </p>

                    </div>


                    <!-- Messages -->

                    {% if messages %}

                        {% for message in messages %}

                            <div
                                class="alert alert-{{ message.tags }}"
                                role="alert"
                            >
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}


                    <!-- Login Form -->

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <div class="d-flex justify-content-end align-items-center mb-4">
                            <span class="text-muted small">Secure sign-in</span>
                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100 login-btn"
                        >
                            Sign in
                        </button>

                    </form>


                    <!-- Register -->

                    <div class="text-center mt-4">

                        <span class="text-muted">
                            Don't have an account?
                        </span>

                        <a
                            href="{% url 'register' %}"
                            class="text-decoration-none fw-medium"
                        >
                            Create account
                        </a>

                    </div>


                    <!-- Security -->

                    <div class="text-center mt-4">

                        <div class="security-text">

                            🔒 Your data is protected by SecureDrive

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
