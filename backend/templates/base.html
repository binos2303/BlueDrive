{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}SecureDrive{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        margin: 0;
        background-color: #f8f9fa;
        color: #212529;
      }

      /* =========================
           NAVBAR
        ========================= */

      .app-navbar {
        height: 64px;
        background-color: #ffffff;
        border-bottom: 1px solid #dee2e6;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1030;
      }

      .brand {
        width: 250px;
        font-size: 21px;
        font-weight: 600;
      }

      .search-box {
        max-width: 600px;
      }

      .search-box input {
        height: 42px;
        border-radius: 10px;
        background-color: #f1f3f5;
        border: none;
      }

      .search-box input:focus {
        background-color: #ffffff;
        box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.15);
      }

      /* =========================
           SIDEBAR
        ========================= */

      .app-sidebar {
        position: fixed;
        top: 64px;
        left: 0;
        bottom: 0;

        width: 250px;

        background-color: #ffffff;
        border-right: 1px solid #dee2e6;

        padding: 20px 12px;
      }

      .new-button {
        border-radius: 12px;
        padding: 11px 20px;
        margin-bottom: 20px;
        font-weight: 500;
      }

      .sidebar-link {
        display: flex;
        align-items: center;

        padding: 10px 14px;
        margin-bottom: 4px;

        border-radius: 8px;

        color: #495057;
        text-decoration: none;

        transition: 0.15s;
      }

      .sidebar-link i {
        font-size: 18px;
        width: 28px;
      }

      .sidebar-link:hover {
        background-color: #f1f3f5;
        color: #212529;
      }

      .sidebar-link.active {
        background-color: #e7f1ff;
        color: #0d6efd;
        font-weight: 500;
      }

      /* =========================
           MAIN CONTENT
        ========================= */

      .app-content {
        margin-left: 250px;
        padding-top: 64px;
        min-height: 100vh;
      }

      .content-container {
        padding: 28px;
      }

      /* =========================
           USER AVATAR
        ========================= */

      .user-avatar {
        width: 38px;
        height: 38px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background-color: #0d6efd;
        color: white;

        font-weight: 600;
      }
      /* =========================
        TOAST NOTIFICATIONS
        ========================= */

      .toast-container-custom {
        position: fixed;
        top: 80px;
        right: 24px;

        width: 360px;
        max-width: calc(100vw - 48px);

        z-index: 9999;

        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast-custom {
        margin: 0;

        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);

        animation:
          toast-slide-in 0.3s ease,
          toast-fade-out 0.4s ease 4.6s forwards;
      }

      @keyframes toast-slide-in {
        from {
          opacity: 0;
          transform: translateX(30px);
        }

        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes toast-fade-out {
        from {
          opacity: 1;
          transform: translateX(0);
        }

        to {
          opacity: 0;
          transform: translateX(30px);
        }
      }

      @media (max-width: 768px) {
        .toast-container-custom {
          top: 74px;
          right: 12px;
          width: calc(100vw - 24px);
          max-width: none;
        }
      }
      /* =========================
           RESPONSIVE
        ========================= */

      .mobile-menu-btn {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }

      .sidebar-mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
        padding: 0 4px;
      }

      .sidebar-backdrop {
        display: none;
      }

      @media (max-width: 767.98px) {
        .app-navbar {
          height: 60px;
        }

        .brand {
          width: auto;
          font-size: 18px;
        }

        .app-sidebar {
          top: 60px;
          width: 270px;
          padding: 16px 14px;
          transform: translateX(-100%);
          transition: transform .2s ease;
          z-index: 1045;
          box-shadow: 8px 0 28px rgba(33, 37, 41, .08);
        }

        .app-sidebar.mobile-open {
          transform: translateX(0);
        }

        .sidebar-backdrop {
          position: fixed;
          inset: 60px 0 0;
          background: rgba(15, 23, 42, .25);
          z-index: 1040;
        }

        .sidebar-backdrop.mobile-open {
          display: block;
        }

        .app-content {
          margin-left: 0;
          padding-top: 60px;
        }

        .content-container {
          padding: 20px 14px;
        }

        .search-box {
          min-width: 0;
          margin: 0 !important;
        }

        .search-box input {
          height: 40px;
          font-size: .9rem;
        }

        .search-box .input-group-text {
          padding-inline: 10px;
        }
      }

      @media (max-width: 575.98px) {
        .brand-label {
          display: none;
        }

        .search-box input {
          padding-left: 8px;
          padding-right: 8px;
        }

        .search-box input::placeholder {
          color: transparent;
        }
      }
      .delete-confirm-modal .modal-content {
        border-radius: 24px;
      }

      .delete-confirm-modal .modal-title {
        font-size: 18px;
        font-weight: 400;
      }

      .delete-confirm-modal .modal-body {
        font-size: 16px;
      }

      .delete-confirm-modal .btn-danger {
        border-radius: 30px;
        padding: 12px 28px;
        font-weight: 600;
      }

      .delete-confirm-modal .btn-light {
        border-radius: 30px;
        padding: 12px 28px;
      }

      .item-name-wrap, .drive-name-wrap {
        min-width: 0;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .item-name, .drive-name {
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .upload-dropzone {
        border: 1px dashed #b8c2cc;
        border-radius: 16px;
        padding: 30px 20px;
        text-align: center;
        background: #f8fafc;
        transition: .15s ease;
      }

      .upload-dropzone:hover, .upload-dropzone.is-dragover {
        border-color: #0d6efd;
        background: #eef5ff;
      }

      .bulk-toolbar {
        border: 1px solid #e3e7eb;
        background: #fff;
        border-radius: 12px;
        padding: 10px 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,.04);
      }

      /* =========================
           GLOBAL DRIVE UI
        ========================= */

      .drive-item,
      .shared-resource-row,
      .trash-item,
      .recent-item {
        min-width: 0;
      }

      .drive-row {
        min-width: 0;
        width: 100%;
      }

      .drive-name-wrap {
        min-width: 0 !important;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .drive-name,
      .drive-name-wrap .text-truncate,
      .item-name,
      .item-name-wrap {
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .drive-actions {
        flex: 0 0 auto;
      }

      .sidebar-link {
        min-height: 44px;
      }

      .sidebar-link.active {
        background: #e8f1ff;
        color: #0d6efd;
        font-weight: 600;
      }

      .sidebar-link.active i {
        color: #0d6efd;
      }

      .shared-resource-row,
      .trash-item {
        transition: background-color .15s ease;
      }

      .shared-resource-row:hover,
      .trash-item:hover {
        background-color: #f8faff;
      }

      .compact-meta {
        font-size: .82rem;
        line-height: 1.45;
      }

      .shared-folder-banner {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 680px;
        padding: 12px 14px;
        border: 1px solid #dbe8fb;
        border-radius: 14px;
        background: #f6f9ff;
      }

      .shared-folder-banner-icon {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        background: #e7f1ff;
        color: #0d6efd;
      }

      .action-menu-btn {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
      }

      .details-panel-row {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #f0f2f4;
      }

      .details-panel-row:last-child {
        border-bottom: 0;
      }

      .details-panel-label {
        color: #6c757d;
        font-size: .85rem;
      }

      .details-panel-value {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      @media (max-width: 767.98px) {
        .details-panel-row {
          grid-template-columns: 1fr;
          gap: 3px;
        }

        .drive-actions {
          margin-left: auto;
        }
      }
    </style>

    {% block extra_css %} {% endblock %}
  </head>

  <body>

    {% include "components/navbar.html" %}
    {% include "components/sidebar.html" %}

    <main class="app-content">
      <div class="content-container">
        {% include "components/alerts.html" %}
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      (function () {
        const sidebar = document.getElementById("appSidebar");
        const toggle = document.getElementById("mobileSidebarToggle");
        const close = document.getElementById("mobileSidebarClose");
        const backdrop = document.getElementById("sidebarBackdrop");
        if (!sidebar || !toggle || !backdrop) return;

        function setOpen(open) {
          sidebar.classList.toggle("mobile-open", open);
          backdrop.classList.toggle("mobile-open", open);
          toggle.setAttribute("aria-expanded", String(open));
          document.body.classList.toggle("overflow-hidden", open);
        }

        toggle.addEventListener("click", () => setOpen(true));
        close?.addEventListener("click", () => setOpen(false));
        backdrop.addEventListener("click", () => setOpen(false));
        sidebar.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => setOpen(false));
        });
        window.addEventListener("resize", () => {
          if (window.innerWidth >= 768) setOpen(false);
        });
      })();
    </script>

    {% block extra_js %} {% endblock %}
  </body>
</html>
