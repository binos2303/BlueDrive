<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SecureDrive</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h3 class="text-center mb-4">
                        Create Account
                    </h3>

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.non_field_errors }}

                        <div class="mb-3">
                            <label class="form-label">
                                Username
                            </label>

                            {{ form.username }}

                            {{ form.username.errors }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            {{ form.email }}

                            {{ form.email.errors }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Password
                            </label>

                            {{ form.password1 }}

                            {{ form.password1.errors }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Confirm Password
                            </label>

                            {{ form.password2 }}

                            {{ form.password2.errors }}
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Register
                        </button>

                    </form>

                    <div class="text-center mt-3">

                        Already have an account?

                        <a href="{% url 'login' %}">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
