name: Repository, backend and frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Test repository safety guard
        run: python -X utf8 -m unittest discover -s backend/tools -p test_repository_safety.py -v
      - name: Inspect working tree
        run: python -X utf8 backend/tools/check_repository_safety.py
      - name: Inspect Git index
        run: python -X utf8 backend/tools/check_repository_safety.py --staged

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx --no-install next typegen
      - run: npx --no-install tsc --noEmit
      - name: Frontend unit regression
        shell: bash
        run: |
          mapfile -t test_files < <(rg --files components lib -g '*.test.mts')
          if ((${#test_files[@]} == 0)); then
            echo 'FAIL: no frontend unit tests discovered'
            exit 1
          fi
          node --experimental-transform-types --test "${test_files[@]}"
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_DB: bluedrive_test_control
          POSTGRES_USER: bluedrive_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U bluedrive_test -d bluedrive_test_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: securedrive.test_settings
      BLUEDRIVE_TEST_DB_TARGET: ci
      BLUEDRIVE_TEST_DB_HOST: 127.0.0.1
      BLUEDRIVE_TEST_DB_PORT: '5432'
      BLUEDRIVE_TEST_DB_NAME: bluedrive_test_control
      BLUEDRIVE_TEST_DB_USER: bluedrive_test
      BLUEDRIVE_TEST_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Dependency compatibility
        run: python -m pip check
      - name: Mark isolated PostgreSQL service
        run: |
          python - <<'PY'
          import os, pathlib, psycopg
          with psycopg.connect(host='127.0.0.1', port=5432, dbname='bluedrive_test_control',
                               user='bluedrive_test', password=os.environ['BLUEDRIVE_TEST_DB_PASSWORD']) as connection:
              connection.execute(pathlib.Path('infra/postgres-test-init.sql').read_text(encoding='utf-8'))
          PY
      - name: Test repository and harness guards
        run: python -X utf8 -m unittest discover -s backend/tools -p 'test_*.py' -v
      - name: Inspect source and index
        run: |
          python -X utf8 backend/tools/check_repository_safety.py
          python -X utf8 backend/tools/check_repository_safety.py --staged
      - name: Django system and migration checks
        run: |
          python -X utf8 backend/manage.py check --settings securedrive.test_settings
          python -X utf8 backend/manage.py makemigrations --check --dry-run --settings securedrive.test_settings
      - name: Full PostgreSQL regression
        run: python -X utf8 infra/seaweedfs/regression.py
      - name: Runner lifecycle without database-using tests
        run: python -X utf8 infra/seaweedfs/regression.py files.tests.test_seaweedfs_integration.LoopbackHTTPTests
      - name: Explicit feature-enabled fixtures
        run: >-
          python -X utf8 infra/seaweedfs/regression.py
          infrastructure.test_storage_routing
          infrastructure.test_runtime_qualification
          infrastructure.test_telemetry
          infrastructure.test_layouts
          files.tests.test_presigned_download
